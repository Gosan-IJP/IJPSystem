; Default PCCE configuration file for the Epson S800 head.
; Typical PCCE S800 system structure: PCCE drives upto 8 HDCs, each HDC drives 1 head.

[Test]
SimFilePath              = "SimFiles"                   ; Path for sim files
SaveSimFiles             = 0                            ; Save *.sim files; 1 = enabled.
LogToDisk                = 1                            ; Write log file to disk; 1 = enabled
LogCommands              = 1                            ; Log commands; 1 = enabled
LogTranslatorEvents      = 0                            ; Log translator events; 1 = enabled
LogSetup                 = 1                            ; Log set up; 1 = enabled
LogModules               = "Waveforms"                  ; Log modules list. If "*" EVERYTHING will be logged
LogFile                  = "PrintEngine.Log"            ; Log file name

[Encoder]
; -- Example of encoder set-up: Using an external quadrature encoder
; -- with 1um resolution, 600 XDPI gives 42.333um between pixels. To produce encoder
; -- divider ratio 42.333 we use (3/127) multiplier/divider.
PrintClock               = 0                            ; 0 = External Encoder, n = frequency (Hz)
Multiplier               = 3                            ; Encoder multiplier (600DPI with 1um encoder)
Divider                  = 127                          ; Encoder divider (600DPI with 1um encoder)
Res1                     = 1                            ; Additional divider for RES1
Res2                     = 2                            ; Additional divider for RES2
Res3                     = 4                            ; Additional divider for RES3
Quadrature               = 1                            ; Encoder is quadrature
Invert                   = 1                            ; Invert encoder direction

[ProductDetect]
Xoffset                  = 600                          ; Print clocks (600 = 1 inch at 600DPI)
ActiveLow                = 1                            ; Product-detect polarity
Filter                   = 150                          ; Filter time-constant (us)

[System]
PccType                  = "PCC2E"                      ; PCC2E or PCCE
HeadType                 = "EPSON_S800"
StitchWidth              = 0                            ; Stitch nozzles per head
NotifyHead               = 0:0                          ; PCC:Head for notification messages
RightToLeft              = 0                            ; Transport direction
Scanning                 = 0                            ; Set to 1 if scanning printer

[Planes]
Yinterlace               = 1                            ; Number of heads interlaced
PlanesPerHdc             = 1                            ; Number of planes addressed per HDC
Plane1                   = 1:1

[EPSON_S800]
Xdpi                     = 600                          ; Target x resolution
BitsPerPixel             = 2                            ; BPP (1,2)
; -- Up to 100 waveform files can be specified here
; -- Note that only ".ComA" WF files are listed here. "ComB" ones must have the same name as "ComA" and
; -- will be loaded automatically
Waveform1                = "Waveform\S800-S1_Standard_Waveforms_ra2023_0113_1.ComA"; Default waveform file
Waveform2                = "Waveform\Gosan_1-JR Default.ComA"
Waveform3                = "Waveform\ETM_Sample_1.ComA"
Waveform4                = "Waveform\ETM_Sample_2.ComA"
Waveform5                = "Waveform\ETM_Sample_3_Jin.ComA"
Waveform6                = "Waveform\241212_double_2.ComA"
Waveform7                = "Waveform\ETM_Sample_1_double.ComA"
Waveform8                = "Waveform\ARKRAY_WF_Sample1.ComA"
Waveform9                = "Waveform\ETM_HEX.ComA"
Waveform10               = "Waveform\ETM_HEX_T2.ComA"
Waveform11               = "Waveform\ETM_HEX_T3.ComA"
Waveform12               = "Waveform\ETM_HEX_T4.ComA"
Waveform13               = "Waveform\ETM_BUT_T1.ComA"

; --- Global system default settings
[DefaultParameterValues]
WaveformFileIdx          = 13                           ; Global default value
; TickleWaveformFileIdx  = 0   ; Don't use tickling waveforms

; --- settings specific for PCC1
[Controller1]
Master                   = 1                            ; This controller is Master
Orientations             = 0,0,0,0,0,0,0,0              ; Head orientations
Xoffsets                 = 0,0,0,0,0,0,0,0              ; X-offsets (clocks) for every head
Yoffsets                 = 0,800,0,0,0,0,0,0            ; Y-offsets for every head
FireOut                  = 1

; --- settings specific for PCC1:HDC1
[HeadDriver1:1]
; WaveformFileIdx     = 1 ; WaveformID applied to the whole head on this HDC

[Ethernet]
; Adapter2              = "Local Area Connection"   ; Enable adapter for PccE connection
Adapter1                 = "PCC2E"

[NozzleCompensation]
GlobalEnable             = 1
