; ============================================================================
;  ComiEcatLibCfg.ini  —  Comizoa EtherCAT 라이브러리 실장(현장) 설정
;  Motion(ComizoaMotionDriver) 이 Connect 시 이 파일을 읽어 마스터를 구성한다.
;  IO(ComizoaIODriver) 는 같은 EtherCAT 마스터를 공유하므로 별도 설정이 없다.
;
;  적용 조건: Config/AppConfig.json 의 DriverMode 를 아래처럼 설정해야 실장비 구동.
;    "DriverMode": { "IO": "Comizoa", "Motion": "Comizoa" }
;
;  주의:
;   - SimulationMode 는 반드시 0 이어야 실제 하드웨어로 동작한다(1 이면 가짜 구동).
;   - IP/PORT/EmbeddedMode 는 현장 컨트롤러 구성에 맞게 수정할 것.
;   - 값이 없거나 파싱 실패 시 드라이버 코드의 기본값이 쓰인다(아래 값 = 기본값).
;   - 파서는 key=value 만 읽고 ';' 이후는 주석. [섹션] 은 가독성용.
; ============================================================================

[LIB_TUNES]
; DC(Distributed Clock) 셋업 지연 [ms]
DC_Setup_Delay = 4000
; 컨트롤러 형태:  1 = Embedded(임베디드 컨트롤러),  0 = PCI 보드
EmbeddedMode   = 1
; 시뮬레이션:  0 = 실장비(실제 EtherCAT),  1 = 가짜 구동  ← 실장 시 반드시 0
SimulationMode = 0

[CONTROL_MSG_COMM]
; 로컬(PC) IP 및 데몬(컨트롤 프로세스) IP
LOCAL_IP       = 192.168.1.253
DAEMON_IP      = 192.168.1.253
; 데몬 포트 (L=대용량/명령, M=모니터)
DAEMON_PORT_L  = 55000
DAEMON_PORT_M  = 5000
; 통신 재시도 횟수
COMM_RETRY_NUM = 10
; 수신 타임아웃 [ms]  (참고용 — 현재 드라이버는 코드 기본값 3000/2000 사용)
RX_TIMEOUT_L   = 3000
RX_TIMEOUT_M   = 2000

[IO_MSG_COMM]
; EtherCAT 원격 디바이스(마스터) IP 및 입/출력 포트
MASTER_IP      = 192.168.1.100
IN_PORT        = 35040
OUT_PORT       = 35041
